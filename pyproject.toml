[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdrive-turbo-copy"
version = "2.0.0"
description = "Fast, resumable, server-side Google Drive folder-to-folder copier with Shared Drive support."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ekaznyra" }]
keywords = ["google-drive", "copy", "colab", "drive-api", "backup"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-httplib2>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-timeout>=2.1", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/ekaznyra/GDrive_Turbo_Copy"
Repository = "https://github.com/ekaznyra/GDrive_Turbo_Copy"

[project.scripts]
gdrive-turbo-copy = "gdrive_turbo_copy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Defensive: a hung test fails instead of blocking CI forever.
timeout = 60

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
